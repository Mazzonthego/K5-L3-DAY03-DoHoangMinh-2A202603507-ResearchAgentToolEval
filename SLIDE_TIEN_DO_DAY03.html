<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiến độ Lab Day 03 · Prompt, Function Calling &amp; Tool Design (MCP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2a3550;
  --text:#e8ecf5; --muted:#9aa6c0; --accent:#ffb547; --accent2:#5ad1a0;
  --blue:#6aa8ff; --red:#ff6b6b; --code:#0b0f18;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:rgba(15,20,32,.92);border-bottom:1px solid var(--line);z-index:10;backdrop-filter:blur(6px)}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--accent)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;font-weight:600;
  padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:#1a1205}
.custom{display:none;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.custom.show{display:flex}
.custom input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px}
.spacer{flex:1}
.clock{font-size:14px;color:var(--muted);white-space:nowrap}
.clock b{color:var(--text)}
.live{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  cursor:pointer;white-space:nowrap}
.live.now{background:rgba(90,209,160,.15);border-color:var(--accent2);color:var(--accent2)}

/* slides */
.deck{position:absolute;top:56px;bottom:44px;left:0;right:0}
.slide{position:absolute;inset:0;padding:34px 6vw 20px;display:none;flex-direction:column;overflow:auto}
.slide.active{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:clamp(34px,4.6vw,60px);line-height:1.1;font-weight:800}
h2{font-size:clamp(26px,3.2vw,42px);line-height:1.15;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-size:clamp(16px,1.5vw,20px);margin-top:10px;max-width:60ch}
.time-big{display:inline-flex;align-items:baseline;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.time-big .t{font-size:clamp(24px,2.6vw,34px);font-weight:800;color:var(--accent)}
.time-big .d{color:var(--muted);font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-cp{background:rgba(106,168,255,.15);color:var(--blue);border:1px solid rgba(106,168,255,.4)}
.b-dl{background:rgba(255,107,107,.13);color:var(--red);border:1px solid rgba(255,107,107,.4)}
.b-now{background:rgba(90,209,160,.15);color:var(--accent2);border:1px solid var(--accent2)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;flex:1;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.card li{overflow-wrap:anywhere;position:relative;padding-left:24px;font-size:clamp(15px,1.25vw,18px);line-height:1.45}
.card li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:2px;border:2px solid var(--accent)}
.card.done li::before{content:"✓";border:0;top:0;width:auto;height:auto;color:var(--accent2);font-weight:800}
.card.tip{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.35)}
.card.tip li::before{content:"→";border:0;top:0;width:auto;height:auto;color:var(--accent);font-weight:800}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:clamp(12px,1vw,14px);
  line-height:1.55;overflow:auto;color:#cfe3ff;white-space:pre}
li code,p code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:.88em;color:#ffd79a}

/* timeline */
.tl{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.tl-row{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:14px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tl-row:hover{border-color:var(--accent)}
.tl-row.now{border-color:var(--accent2);background:rgba(90,209,160,.08)}
.tl-row.past{opacity:.55}
.tl-time{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tl-name{font-size:17px;font-weight:600}
.tl-name small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.tl-bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.tl-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tl-dur{font-size:13px;color:var(--muted);text-align:right}

.loop{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:22px}
.loop div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.4}
.loop b{display:block;color:var(--accent);font-size:26px;margin-bottom:4px}
.shiftpick{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.shiftpick button{background:var(--panel);border:2px solid var(--line);color:var(--text);font:inherit;border-radius:14px;
  padding:16px 22px;cursor:pointer;text-align:left;min-width:190px}
.shiftpick button b{display:block;font-size:24px}
.shiftpick button span{color:var(--muted);font-size:14px}
.shiftpick button.on{border-color:var(--accent);background:rgba(255,181,71,.08)}
.note{color:var(--muted);font-size:14px;margin-top:12px}

/* bottom */
.bottom{position:fixed;bottom:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-top:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}
.prog{flex:1;height:4px;background:var(--panel2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;width:34px;height:28px;cursor:pointer;font-size:15px}
.countdown{font-weight:700;color:var(--accent2)}

@media (max-width:900px){
  .grid{grid-template-columns:1fr;flex:none!important}
  .col{min-height:auto}
  .topbar{overflow-x:auto;gap:8px;padding:0 10px}
  .seg button{padding:6px 8px;font-size:13px}
  .live{display:none}
  pre{white-space:pre;max-width:100%}
  .loop{grid-template-columns:repeat(2,1fr)}
  .tl-row{grid-template-columns:110px 1fr}
  .tl-dur{display:none}
  .brand,.clock{display:none}
  .slide{padding:24px 16px}
}
@media print{
  html,body{overflow:visible}
  .topbar,.bottom{display:none}
  .deck{position:static}
  .slide{display:flex!important;position:relative;height:100vh;page-break-after:always}
}

/* ===== bản tối giản ===== */
.slide.m{justify-content:center;align-items:flex-start;padding-top:20px}
.m-top{display:flex;align-items:center;gap:8px}
.m-top .kicker{margin:0}
.m-time{font-size:clamp(64px,11vw,150px);font-weight:800;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:10px 0 6px}
.m-time span{color:var(--muted);font-weight:400;margin:0 .15em;font-size:.6em;vertical-align:.2em}
.m-name{font-size:clamp(30px,4vw,54px)}
.m-goal{font-size:clamp(18px,1.8vw,24px);color:var(--muted);margin-top:4px}
.m-goal.warn{color:var(--red);margin-top:26px}
.keys,.flow{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap;align-items:center}
.key{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 24px;display:flex;align-items:center;gap:14px;min-width:200px}
.key i{font-style:normal;font-size:clamp(26px,2.6vw,36px)}
.key b{font-size:clamp(17px,1.7vw,24px);font-weight:700}
.flow em{font-style:normal;color:var(--muted);font-size:28px}
.detail{display:none;width:100%;margin-top:26px}
body.det .detail{display:block}



.dbtn{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--text)}
body.det .dbtn{border-color:var(--accent);color:var(--accent)}
@media (max-width:900px){.key{min-width:0;flex:1 1 140px;padding:12px 14px}.flow em{display:none}}

/* ===== bố cục lấp đầy ===== */
.slide.L{grid-template-rows:1fr auto;gap:22px;padding:26px 4vw 18px}
.slide.L.active{display:grid}
.L-main{display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;align-items:stretch;min-height:0}
.L-left{display:flex;flex-direction:column;justify-content:center;min-width:0}
.L-right{display:flex;flex-direction:column;gap:14px;justify-content:center;min-height:0;min-width:0}
.L-right .key{flex:1;max-height:170px;min-width:0;padding:0 30px;gap:22px;border-radius:20px;position:relative}
.L-right .key i{font-size:clamp(34px,4vw,56px)}
.L-right .key b{font-size:clamp(22px,2.4vw,36px)}
.L-right .key em{font-style:normal;font-weight:800;color:var(--accent);font-size:clamp(22px,2.2vw,32px);width:1.2em}
.m-time{font-size:clamp(70px,10vw,170px)}
.m-time span{display:block;font-size:.38em;margin:6px 0 0;color:var(--muted);vertical-align:0}
.m-name{font-size:clamp(32px,3.8vw,60px);margin-top:10px}
.m-name.big{font-size:clamp(44px,5.6vw,88px);line-height:1.08}
.m-goal{font-size:clamp(18px,1.8vw,28px)}
.cover-h{font-size:clamp(48px,6.4vw,104px);line-height:1.02;margin:6px 0 10px}
.L-left .shiftpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.L-left .shiftpick button{min-width:0;padding:16px 18px}
.L-left .shiftpick button b{font-size:clamp(18px,1.8vw,28px)}
.agenda{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;gap:6px;justify-content:flex-start}
.agenda h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ag{flex:1;display:flex !important;align-items:center;gap:18px;padding:0 14px !important;border-radius:12px;background:transparent !important;border:1px solid transparent !important;cursor:pointer;max-height:80px}
.ag b{font-size:clamp(18px,1.7vw,26px);color:var(--accent);font-variant-numeric:tabular-nums;width:3.2em}
.ag span{font-size:clamp(16px,1.5vw,22px);font-weight:600}
.ag:hover{background:var(--panel2) !important}
.ag.now{border-color:var(--accent2) !important}
.ag.past{opacity:.45}
.strip{display:flex;gap:4px;height:62px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow:hidden;cursor:pointer;min-width:0;display:flex;flex-direction:column;justify-content:center}
.st b{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.st span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.on{background:var(--accent);border-color:var(--accent)}
.st.on b,.st.on span{color:#1a1205}
.st.now{box-shadow:inset 0 0 0 2px var(--accent2)}
.st.past{opacity:.5}
.tl-wrap{display:flex;flex-direction:column;min-height:0;grid-row:1/3}
.tl-wrap .tl{flex:1;margin-top:12px}
.tl-wrap .tl-row{flex:1;grid-template-columns:220px 1fr 160px}
.tl-wrap .tl-time{font-size:clamp(18px,2vw,30px);color:var(--accent)}
.tl-wrap .tl-name{font-size:clamp(18px,2vw,30px)}





.L-right .detail{margin-top:0}
@media (max-width:900px){
  .slide.L{padding:18px 16px}
  .L-main{grid-template-columns:1fr;overflow:auto}
  .L-left .shiftpick{grid-template-columns:1fr}
  .L-right .key{min-height:70px}
  .strip{height:40px}.st span{display:none}
  .tl-wrap .tl-row{grid-template-columns:100px 1fr}

}

/* ===== đồng hồ từng mốc + sửa tràn ngang ===== */
.slide.L{grid-template-columns:minmax(0,1fr)}
.L-main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.m-time{font-size:clamp(28px,3.4vw,52px);display:flex;align-items:baseline;gap:.3em;margin:8px 0 0}
.m-time span{display:inline;font-size:1em;margin:0;color:var(--muted)}
.slide[data-id="submit"] .m-time{font-size:clamp(70px,10vw,160px)}
.timer{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.t-face{font-size:clamp(64px,9vw,150px);font-weight:600;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.03em;width:100%}
.timer button{font:inherit;font-weight:700;font-size:clamp(15px,1.4vw,20px);border-radius:12px;padding:10px 20px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.timer .t-go{background:var(--accent2);border-color:var(--accent2);color:#06281b}
.timer.run .t-go{background:var(--panel2);color:var(--text);border-color:var(--line)}
.timer.run .t-face{color:var(--accent2)}
.timer.warn .t-face{color:var(--accent)}
.timer.over .t-face{color:var(--red)}
.cdbar{cursor:pointer;font-size:14px;color:var(--text)}
.countdown.over{color:var(--red)}
.st.now{box-shadow:inset 0 0 0 2px var(--accent2)}
.ag.now{border-color:var(--accent2) !important}

@media (max-width:1350px){.brand{display:none}}

.cover-h{font-size:min(4.4vw,7.4vh)}
.cover-h .mcp{color:var(--accent)}
.slide[data-id="cover"] .kicker{font-size:min(15px,2.2vh)}
.L-left .shiftpick button{padding:min(16px,2vh) 16px}
.L-left .shiftpick button b{font-size:min(1.8vw,3.4vh);white-space:nowrap}
.agenda{overflow:hidden;padding:min(22px,2.6vh) 24px}
.ag{min-height:0}
.ag b{font-size:min(1.7vw,3.2vh)} .ag span{font-size:min(1.5vw,2.8vh)}
@media (max-width:900px){.cover-h{font-size:40px}.L-left .shiftpick button b{font-size:20px}.ag b,.ag span{font-size:16px}.agenda{overflow:visible}}
@media (max-width:900px){.L-main{grid-template-columns:minmax(0,1fr)}.t-face{font-size:72px}.L-right .key{flex:none;min-height:64px}}

/* ===== slide lấy key ===== */
.keyslide{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
.kurl{color:var(--blue);font-size:min(1.4vw,2.6vh);margin-top:8px;overflow-wrap:anywhere}
.ksteps{list-style:none;counter-reset:k;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.ksteps li{counter-increment:k;display:flex;align-items:center;gap:14px;font-size:min(1.8vw,3.2vh);font-weight:600}
.ksteps li::before{content:counter(k);flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent);color:#1a1205;display:grid;place-items:center;font-size:.8em;font-weight:800}
.kenv{margin-top:24px;display:inline-block;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#ffd79a;font-size:min(1.3vw,2.4vh)}
.shot{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel);min-height:0;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:contain;background:transparent}
.shot .ph{display:none;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
.shot .ph b{font-size:64px}.shot .ph span{font-size:20px;font-weight:600}
.shot.miss{border-style:dashed;cursor:default}.shot.miss img{display:none}.shot.miss .ph{display:flex}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:94vh;border-radius:10px}
@media (max-width:900px){.keyslide{grid-template-columns:minmax(0,1fr)}.shot{min-height:220px}.ksteps li{font-size:17px}.kurl,.kenv{font-size:14px}}
.kname{font-size:min(4vw,7.5vh);line-height:1.1}

/* ===== chế độ Chi tiết: chỉ áp dụng cho slide có phần chi tiết ===== */
body.det .slide.hasdet .L-main{grid-template-columns:minmax(0,1fr);align-items:start;align-content:start;overflow:auto;gap:18px}
body.det .slide.hasdet .L-left{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;column-gap:22px;row-gap:4px}
body.det .slide.hasdet .m-top,body.det .slide.hasdet .kicker{width:100%}
body.det .slide.hasdet .m-time{font-size:clamp(22px,2.2vw,32px);margin:0}
body.det .slide.hasdet .m-name{font-size:clamp(22px,2.4vw,34px);margin:0}
body.det .slide.hasdet .m-name.big br{display:none}
body.det .slide.hasdet .m-goal{font-size:clamp(15px,1.3vw,18px);margin:0}
body.det .slide.hasdet .timer{margin:0;gap:10px;flex-wrap:nowrap}
body.det .slide.hasdet .t-face{font-size:clamp(28px,3vw,44px);width:auto}
body.det .slide.hasdet .timer button{padding:6px 14px;font-size:15px}
body.det .slide.hasdet .L-right{justify-content:flex-start}
body.det .slide.hasdet .L-right .key{display:none}
body.det .slide.hasdet .detail{display:block}
.slide:not(.hasdet) .detail{display:none!important}
.dbtn.off{opacity:.4;cursor:default}
body.det .slide.hasdet{grid-template-rows:minmax(0,1fr)}
body.det .slide.hasdet .strip{display:none}
.shot.two{flex-direction:column;gap:8px;padding:8px;background:var(--panel)}
.shot.two img{flex:1;min-height:0;border-radius:10px}
.shot img{cursor:zoom-in}
.settle{opacity:.6;cursor:default}

/* ===== icon Lucide ===== */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;flex:none}
.key i{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:.45em;background:rgba(255,181,71,.12);color:var(--accent)}
.key i .ic{width:.8em;height:.8em}
.L-right .key i{font-size:clamp(30px,3.4vw,48px)}
.kic{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:.3em;background:rgba(255,181,71,.12);color:var(--accent);margin-right:.35em;vertical-align:-.18em}
.kic .ic{width:.7em;height:.7em}
.ag span .ic,.tl-name .ic{color:var(--accent);margin-right:.25em}
.timer button{display:inline-flex;align-items:center;gap:8px}
.m-goal.warn .ic{color:var(--red)}
.shot .ph b .ic{width:64px;height:64px}

.kind{display:inline-flex;align-items:center;gap:8px;margin:2px 0 6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(90,209,160,.5);background:rgba(90,209,160,.1);color:var(--accent2);font-size:min(1.3vw,2.4vh);width:fit-content}
.kind b{color:var(--text)}
.reponame{margin:14px 0 6px;padding:12px 16px;border-radius:12px;background:var(--code);border:1px solid var(--line);font-size:min(1.5vw,2.8vh);color:#ffd79a;overflow-wrap:anywhere}
.reponame span{color:var(--accent2)}

.rules{gap:14px}
.rule{flex:1;max-height:190px;display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 26px;min-height:0}
.rule>i{flex:none;display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:.45em;background:rgba(255,181,71,.12);color:var(--accent);font-size:clamp(28px,3vw,44px)}
.rule>i .ic{width:.8em;height:.8em}
.rule span{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rule b{display:block;font-size:clamp(17px,1.7vw,26px);margin:4px 0;overflow-wrap:anywhere;line-height:1.25}
.rule b.mono{color:#ffd79a;font-size:clamp(14px,1.35vw,21px)}
.rule small{display:block;color:var(--muted);font-size:clamp(12px,1vw,15px);line-height:1.45}
@media (max-width:900px){.rule{max-height:none;flex:none}}

/* ===== nhấn mạnh quy định ===== */
.rmain{display:flex;flex-direction:column;gap:22px;justify-content:center;min-height:0;min-width:0}
.rhead{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.rhead .kicker{width:100%;margin:0}
.rhead .m-name{font-size:clamp(34px,4.2vw,64px);margin:0;line-height:1.05}
.rhead .m-goal{margin:0}
.rules4{display:grid;grid-template-columns:1fr 1.15fr 1.45fr;grid-template-rows:auto auto;gap:16px}
.r4{border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:2px solid;min-width:0;min-height:clamp(150px,24vh,280px)}
.r4 span{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.85}
.r4 b{font-size:clamp(26px,3vw,46px);line-height:1.1;font-weight:800;overflow-wrap:anywhere}
.r4 b.mono{font-size:clamp(18px,1.9vw,30px);font-weight:600}
.r-repo{grid-column:1/-1;min-height:clamp(110px,17vh,200px)}
.r-lms b.mono{white-space:nowrap;overflow-wrap:normal;font-size:clamp(15px,1.75vw,30px)}
.r-repo b.mono{font-size:clamp(20px,2.4vw,38px);overflow-wrap:normal;word-break:break-all}
.r4 b em{font-style:normal;text-decoration:underline;text-underline-offset:5px}
.r4 small{font-size:clamp(13px,1.05vw,16px);color:var(--muted);line-height:1.45}
.r4 small u{color:var(--text);text-decoration-color:currentColor}
.r-team{background:rgba(90,209,160,.10);border-color:rgba(90,209,160,.6)}.r-team span,.r-team b{color:var(--accent2)}
.r-dl{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.65)}.r-dl span,.r-dl b{color:var(--red)}
.r-repo{background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.55)}.r-repo span,.r-repo b{color:var(--accent)}
.r-lms{background:rgba(106,168,255,.10);border-color:rgba(106,168,255,.6)}.r-lms span,.r-lms b{color:var(--blue)}
.remind{display:flex;align-items:center;gap:10px;margin-right:10px;font-size:13px;color:var(--muted);white-space:nowrap;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.remind b{color:var(--text);font-weight:700}
.remind>b:first-child{color:var(--accent2)}
.remind i{width:1px;height:14px;background:var(--line)}
.remind .ic{color:var(--accent)}
.lmsbig{display:inline-flex;align-items:center;gap:12px;margin:12px 0 4px;padding:12px 18px;border-radius:14px;border:2px solid rgba(106,168,255,.6);background:rgba(106,168,255,.1);color:var(--blue);font-size:clamp(18px,2vw,30px);font-weight:600;width:fit-content;max-width:100%;overflow-wrap:anywhere}
@media (max-width:1250px){.remind{display:none}}
@media (max-width:900px){.rules4{grid-template-columns:1fr}.r4,.r-repo{min-height:0}.r-lms b.mono{white-space:normal;overflow-wrap:anywhere}}

const toMin = s => { const [a,b]=s.split(":").map(Number); return a*60+b; };
const fmt = m => { m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
function range(){
  let s,e;
  if(shift==="custom"){ s=toMin(document.getElementById("cStart").value||"08:00"); e=toMin(document.getElementById("cEnd").value||"12:00"); }
  else { [s,e]=shift.split("-").map(toMin); }
  if(e<=s) e+=1440;
  return {s,e,total:e-s};
}
const SETTLE = 15; // 15 phút đầu ca để ổn định lớp, lab bắt đầu sau đó
function schedule(){
  let {s,total} = range();
  s += SETTLE; total -= SETTLE;
  const k = total/BASE;
  const r5 = x => Math.round(x*k/5)*5;
  return PHASES.map((p,i)=>{
    const a = s + r5(p.from);
    const b = i===PHASES.length-1 ? s+total : s + r5(p.to);
    return {...p, start:a, end:b};
  });
}

        <p class="m-goal">Bài nhóm: trưởng nhóm thêm repo <code>K5-L3-DAY03-<i>TenNhom</i>-${TENBAI}</code>, liệt kê thành viên trong <code>TEAM.md</code></p>
        <p class="m-goal warn">${ic("triangle-alert")} Nộp muộn bị trừ điểm · repo không chứa <code>.env</code> và API key</p>
      </div>
      <div class="L-right">
        <div class="key"><i>${ic("github")}</i><b>Push repo đúng tên</b></div>
        <div class="key"><i>${ic("upload")}</i><b>Nộp link trên LMS trước ${DL.dlShort}</b></div>
        <div class="key"><i>${ic("circle-check")}</i><b>Đủ version_log, REPORT, runs</b></div>
        ${detail(`<div class="card done"><h3>Repo cần có (trong <code>starter_v0/</code>)</h3><ul>
          <li><code>artifacts/system_prompt.md</code>, <code>tools.yaml</code>, <code>version_log.csv</code> (v0–v3), <code>REPORT.md</code> (Phần A + B)</li>
          <li><code>data/eval_group.json</code> ≥ 10 case · <code>tests/</code> xanh</li>
          <li><code>runs/*.json</code>, <code>transcripts/*.transcript.json</code>, code tool mới / UI</li>
          <li>Tên repo không dấu, không khoảng trắng, nối bằng <code>-</code>, ví dụ <code>K5-L3-DAY03-NguyenVanA-2A20260000-${TENBAI}</code></li>
          <li>Hạn nộp: ca 9:00 → 23:59 cùng ngày · ca 14:00 → 23:59 cùng ngày · ca 16:30 → 12:00 trưa hôm sau (trừ khi key coach báo khác trong 48h); nộp muộn bị trừ điểm</li>
        </ul></div>`)}
      </div>
    </div>
    ${strip(-1)}
  </section>`);

  // Điểm danh cuối buổi
  out.push(`<section class="slide L" data-id="attend">
    <div class="att">
      <div class="att-txt">
        <div class="kicker">Cuối buổi · trước khi về</div>
        <h2 class="m-name big">Điểm danh<br>cuối buổi</h2>
        <p class="m-goal">Quét mã bằng điện thoại, điền form là xong</p>
        <div class="att-chk">
          <div>${ic("github")} Đã push repo</div>
          <div>${ic("upload")} Đã nộp link trên LMS</div>
          <div>${ic("qr-code")} Đã quét điểm danh</div>
        </div>
      </div>
      <div class="qrbox big">${QR_SVG}</div>
    </div>
  </section>`);
  return out.join("");
}

/* ============ ĐIỀU HƯỚNG ============ */
let idx = 0;
function slides(){ return [...deck.querySelectorAll(".slide")]; }
function show(i){
  const all = slides(); idx = Math.max(0,Math.min(all.length-1,i));
  all.forEach((el,j)=>el.classList.toggle("active",j===idx));
  document.getElementById("pageNo").textContent = (idx+1)+" / "+all.length;
  document.getElementById("prog").style.width = ((idx+1)/all.length*100)+"%";
  document.getElementById("dbtn").classList.toggle("off",!all[idx].classList.contains("hasdet"));
  const id = all[idx].dataset.id;
  history.replaceState(null,"",`#ca=${shift}&s=${id}`);
}
function goId(id){ const j = slides().findIndex(x=>x.dataset.id===id); if(j>=0) show(j); }
function render(keepId){
  const cur = keepId || (slides()[idx]||{}).dataset?.id;
  deck.innerHTML = slidesHTML();
  { const D=(SHIFTS[shift]||{dlShort:"23:59"}); document.getElementById("remind").innerHTML = `<b>${ic("users")} Bài nhóm</b><i></i>${ic("flag")} Hạn <b>${D.dl||"23:59 hôm nay"}</b><i></i>${ic("upload")} <b class="mono">aithucchien.vinuni.edu.vn</b>`; }
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.s===shift));
  document.getElementById("custom").classList.toggle("show",shift==="custom");
  deck.querySelectorAll(".shiftpick button").forEach(b=>b.onclick=()=>setShift(b.dataset.s));
  deck.querySelectorAll(".slide").forEach(sl=>sl.classList.toggle("hasdet",!!sl.querySelector(".detail")));
  deck.querySelectorAll("[data-go]").forEach(r=>r.onclick=()=>goId(r.dataset.go));
  deck.querySelectorAll(".shot img").forEach(im=>im.onclick=()=>{ const z=document.createElement("div"); z.className="zoom"; const c=document.createElement("img"); c.src=im.src; z.appendChild(c); z.onclick=()=>z.remove(); document.body.appendChild(z); });
  deck.querySelectorAll(".timer").forEach(el=>{ const i=+el.dataset.t; el.querySelector(".t-go").onclick=()=>toggleTimer(i); el.querySelector(".t-reset").onclick=()=>resetTimer(i); });
  if(cur) goId(cur); else show(0);
  tick();
}
function setShift(s){ shift=s; T.i=-1; T.running=false; try{localStorage.setItem("d03shift",s);}catch(e){} render(); }

document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>setShift(b.dataset.s));
["cStart","cEnd"].forEach(id=>document.getElementById(id).addEventListener("change",()=>render()));
document.getElementById("prev").onclick=()=>show(idx-1);
document.getElementById("next").onclick=()=>show(idx+1);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(idx+1);}
  if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(idx-1);}
  if(e.key==="Home") show(0);
  if(e.key==="End") show(slides().length-1);
  if(e.key==="t") goId("cover");
  if(e.key==="s"||e.key==="S"){ const i=curIdx(); if(i>=0) toggleTimer(i); else if(T.i>=0) toggleTimer(T.i); }
  if(e.key==="r"||e.key==="R"){ const i=curIdx(); if(i>=0) resetTimer(i); }
  if(e.key==="d"||e.key==="D") toggleDet();
});
let tx=null; deck.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
deck.addEventListener("touchend",e=>{ if(tx===null)return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) show(idx+(d<0?1:-1)); tx=null; });

/* ============ ĐỒNG HỒ ĐẾM NGƯỢC TỪNG MỐC ============ */
const T={i:-1,left:0,running:false,last:0};
function mmss(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); return (neg?"+":"")+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function durSec(i){ const p=schedule()[i]; return (p.end-p.start)*60; }
function toggleTimer(i){
  if(T.i!==i){ T.i=i; T.left=durSec(i); T.running=false; }
  T.running=!T.running; T.last=Date.now(); paint();
}
function resetTimer(i){ T.i=i; T.left=durSec(i); T.running=false; paint(); }
function paint(){
  const sch=schedule();
  document.querySelectorAll(".timer").forEach(el=>{
    const i=+el.dataset.t, mine=T.i===i;
    const left = mine ? T.left : durSec(i);
    el.querySelector(".t-face").textContent = mmss(left);
    el.classList.toggle("run", mine && T.running);
    el.classList.toggle("over", mine && left<=0);
    el.classList.toggle("warn", mine && left>0 && left<=300);
    const lbl = mine ? (T.running?"Tạm dừng":(left===durSec(i)?"Bắt đầu":"Tiếp tục")) : "Bắt đầu";
    const go = el.querySelector(".t-go"); if(go.dataset.l!==lbl){ go.dataset.l=lbl; go.innerHTML = ic(lbl==="Tạm dừng"?"pause":"play")+`<span>${lbl}</span>`; }
  });
  document.querySelectorAll(".tl-row,.st").forEach(r=>r.classList.toggle("now", +r.dataset.i===T.i));
  const cd=document.getElementById("cd");
  if(T.i>=0){
    cd.innerHTML = `⏱ ${sch[T.i].name}: <span class="countdown${T.left<=0?' over':''}">${T.left<=0?'hết giờ '+mmss(T.left):mmss(T.left)}</span>${T.running?'':' (tạm dừng)'}`;
    cd.onclick=()=>goId(sch[T.i].id);
  } else { cd.textContent=""; }
}
function tick(){
  if(T.running){ const n=Date.now(); T.left-=(n-T.last)/1000; T.last=n; }
  paint();
}
function curIdx(){ const el=slides()[idx]; return el && el.dataset.i!==undefined ? +el.dataset.i : -1; }
setInterval(tick,250);
function toggleDet(){document.body.classList.toggle("det");}
document.getElementById("dbtn").onclick=toggleDet;

const hs = location.hash.match(/s=([\w-]+)/);
render(hs?hs[1]:"cover");
window.addEventListener("hashchange",()=>{
  const a=location.hash.match(/ca=([\d:]+-[\d:]+|custom)/), b=location.hash.match(/s=([\w-]+)/);
  if(a && a[1]!==shift){ shift=a[1]; render(b?b[1]:null); } else if(b) goId(b[1]);
});
</script>

# Streamlit — Research Agent demo UI
# Run: streamlit run app.py
# Theme styles live in app.py so the UI follows the same tokens as the design.

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0B4F8A"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
font = "sans serif"

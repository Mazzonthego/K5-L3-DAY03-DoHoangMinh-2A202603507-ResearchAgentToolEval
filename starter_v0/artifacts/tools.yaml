  # v3
  - name: fetch
    description: "Tải và trả về nội dung văn bản (đã bỏ HTML) của MỘT trang web, từ một URL đã biết. Dùng khi: người dùng gửi một URL cụ thể và muốn đọc, tóm tắt, trích ý hoặc hỏi về nội dung trang đó; hoặc cần đọc chi tiết một URL đã xuất hiện trong kết quả trước đó. Không dùng khi: chưa có URL thật trong hội thoại. Tuyệt đối không tự đoán hoặc tự ghép URL (kể cả kiểu \"https://tenmien.com/...\"); nếu người dùng nhắc tới một trang mà không đưa link thì không gọi fetch, hãy hỏi lại họ đường link. Mỗi lần gọi chỉ đọc một URL; nếu có nhiều URL thì gọi fetch nhiều lần."
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "Đường link đầy đủ của trang cần đọc, có cả https:// ở đầu. Hãy copy y nguyên link mà người dùng gửi hoặc link đã có trong kết quả trước đó, đừng sửa hay cắt bớt gì. Chỉ ghi tên trang hoặc tên miền thôi thì chưa đủ, và cũng đừng điền từ khóa vào đây."
      required: [url]

  - name: trending_on_X
    description: "Lấy danh sách chủ đề/hashtag đang trending trên X ngay lúc này tại MỘT khu vực (mặc định Việt Nam). Kết quả chỉ gồm thứ hạng, tên trend, lượng bài (có thể trống) và link tìm kiếm trên X; KHÔNG có nội dung bài đăng. Dùng khi: người dùng hỏi đang có gì hot, xu hướng, trend trên X/Twitter/mạng xã hội mà chưa đưa từ khóa cụ thể. Không dùng khi: người dùng đã có từ khóa, chủ đề hoặc tài khoản cụ thể, hỏi tin tức chung như \"tin hôm nay\", hoặc hỏi xu hướng của một lĩnh vực/khoảng thời gian như \"xu hướng thời trang tháng 10\". Không đoán nội dung trend từ tên của nó. Nếu kết quả có trường error thì báo lỗi cho người dùng, không bịa trend và không gọi lại y hệt."
    parameters:
      type: object
      properties:
        location:
          type: string
          enum: [vietnam, worldwide, us, uk, japan, korea, singapore, thailand, india]
          default: "vietnam"
          description: "Khu vực lấy trend. Người dùng không nói khu vực thì để mặc định vietnam, không hỏi lại. Quy đổi: \"toàn cầu\"/\"thế giới\"/\"global\" -> worldwide; Mỹ -> us; Anh -> uk; Nhật Bản -> japan; Hàn Quốc -> korea; Singapore -> singapore; Thái Lan -> thailand; Ấn Độ -> india. Chỉ có các giá trị này; nước khác thì không tự thay bằng nước gần giống."
        limit: {type: integer, default: 10, description: "Số trend cần lấy, số nguyên từ 1 đến 50. Giữ đúng số người dùng yêu cầu; không nói thì dùng mặc định 10. Yêu cầu hơn 50 thì truyền 50 và báo tối đa là 50."}
        contains: {type: string, default: "", description: "Chỉ giữ các trend có chứa chuỗi này (không phân biệt hoa thường), ví dụ \"ai\". Để trống nếu người dùng không yêu cầu lọc. Bộ lọc chạy trên tối đa 50 trend của khu vực rồi mới cắt theo limit, nên có thể trả về ít hơn limit hoặc rỗng."}
      required: []

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
